<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="cg" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#162216" stroke-width="0.7"/>
    </pattern>
  </defs>

  <!-- Fondo -->
  <rect width="560" height="320" fill="#0c0f0c"/>
  <rect width="560" height="320" fill="url(#cg)"/>

  <!-- Líneas de scanline -->
  <rect width="560" height="320" fill="none" opacity="0.04"/>

  <!-- Panel terminal central -->
  <rect x="40" y="36" width="480" height="248" rx="8" fill="#0f1a0f" stroke="#1e3a1e" stroke-width="1.2"/>

  <!-- Barra superior del terminal -->
  <rect x="40" y="36" width="480" height="28" rx="8" fill="#162416"/>
  <rect x="40" y="52" width="480" height="12" fill="#162416"/>
  <!-- dots -->
  <circle cx="62" cy="50" r="5" fill="#3a1a1a"/>
  <circle cx="80" cy="50" r="5" fill="#3a3a1a"/>
  <circle cx="98" cy="50" r="5" fill="#1a3a1a"/>
  <text x="280" y="54" text-anchor="middle" font-family="monospace" font-size="10" fill="#2a4a2a">codificador_llm — python main.py</text>

  <!-- Líneas de código simuladas -->
  <!-- prompt -->
  <text x="60" y="88" font-family="'Courier New',monospace" font-size="11" fill="#2a5a2a">$</text>
  <text x="72" y="88" font-family="'Courier New',monospace" font-size="11" fill="#4ade80">python main.py</text>

  <!-- output líneas -->
  <text x="60" y="106" font-family="'Courier New',monospace" font-size="10" fill="#1e3a1e">=== PROYECTOS DISPONIBLES ===</text>
  <text x="60" y="120" font-family="'Courier New',monospace" font-size="10" fill="#2a4a2a">  1. APP</text>
  <text x="60" y="133" font-family="'Courier New',monospace" font-size="10" fill="#2a4a2a">  2. SC</text>
  <text x="60" y="146" font-family="'Courier New',monospace" font-size="10" fill="#2a4a2a">  3. CLASE_ALTA</text>

  <!-- separador -->
  <line x1="60" y1="158" x2="500" y2="158" stroke="#1a3a1a" stroke-width="0.8" stroke-dasharray="4 4"/>

  <!-- procesamiento -->
  <text x="60" y="174" font-family="'Courier New',monospace" font-size="10" fill="#1a4a1a">[INFO] Cargando: app3.xlsx</text>
  <text x="60" y="187" font-family="'Courier New',monospace" font-size="10" fill="#1a4a1a">[INFO] 1.842 respuestas · 4 preguntas</text>
  <text x="60" y="200" font-family="'Courier New',monospace" font-size="10" fill="#236a23">[PROCESANDO] Batch 3/12 ·</text>

  <!-- barra de progreso -->
  <rect x="284" y="191" width="96" height="10" rx="2" fill="#1a2a1a"/>
  <rect x="284" y="191" width="56" height="10" rx="2" fill="#22c55e" opacity="0.7"/>
  <text x="386" y="200" font-family="'Courier New',monospace" font-size="9" fill="#2a5a2a">58%</text>

  <text x="60" y="216" font-family="'Courier New',monospace" font-size="10" fill="#1a4a1a">[OK] 847 valores clasificados</text>
  <text x="60" y="229" font-family="'Courier New',monospace" font-size="10" fill="#1a4a1a">[REFUERZOS] 23 variaciones acumuladas</text>

  <!-- cursor parpadeante -->
  <text x="60" y="248" font-family="'Courier New',monospace" font-size="11" fill="#2a5a2a">$</text>
  <rect x="72" y="237" width="8" height="13" fill="#4ade80" opacity="0.9"/>

  <!-- glow central sutil -->
  <ellipse cx="280" cy="160" rx="200" ry="120" fill="#00ff41" opacity="0.018"/>

  <!-- Tag chips inferiores -->
  <rect x="60" y="268" width="54" height="16" rx="8" fill="#0f2a0f" stroke="#1e4a1e" stroke-width="0.8"/>
  <text x="87" y="280" text-anchor="middle" font-family="monospace" font-size="8" fill="#4ade80">Python</text>

  <rect x="122" y="268" width="46" height="16" rx="8" fill="#0f2a0f" stroke="#1e4a1e" stroke-width="0.8"/>
  <text x="145" y="280" text-anchor="middle" font-family="monospace" font-size="8" fill="#4ade80">LLM</text>

  <rect x="176" y="268" width="56" height="16" rx="8" fill="#0f2a0f" stroke="#1e4a1e" stroke-width="0.8"/>
  <text x="204" y="280" text-anchor="middle" font-family="monospace" font-size="8" fill="#4ade80">pandas</text>

  <rect x="240" y="268" width="40" height="16" rx="8" fill="#0f2a0f" stroke="#1e4a1e" stroke-width="0.8"/>
  <text x="260" y="280" text-anchor="middle" font-family="monospace" font-size="8" fill="#4ade80">NLP</text>
</svg>
